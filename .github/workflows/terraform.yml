---
name: Terraform Auto Apply

on:
  push:
    branches:
      - feat/*
      - fix/*
  pull_request:
    types:
      - closed
    branches: 
      - prod
      - dev

env:
  TF_VAR_token: ${{ secrets.TOKEN }}
  TF_VAR_cloud: ${{ secrets.CLOUD }}
  TF_VAR_domain: ${{ secrets.DOMAIN }}
  TF_VAR_public_ssh_key: ${{ secrets.PUBLIC_SSH_KEY }}

jobs:
  check-dev:
    if: github.ref_name != 'prod'
    name: check-dev
    runs-on: ubuntu-latest
    environment: dev
    env:
          TF_VAR_folder: ${{ secrets.FOLDER }}
          DIR: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: ./terraform/${{ env.DIR }}
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        working-directory: ./terraform/${{ env.DIR }}
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ env.DIR }}/terraform.tfstate" \
            -backend-config="bucket=${{ secrets.BUCKET }}" \
            -backend-config="access_key=${{ secrets.ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SECRET_KEY }}"

      - name: Terraform Validate
        working-directory: ./terraform/${{ env.DIR }}
        run: terraform validate -no-color -json

      - name: Terraform Plan
        working-directory: ./terraform/${{ env.DIR }}
        run: |
          terraform plan -input=false -compact-warnings -out=plan.file
      
      - name: Save Plan
        uses: actions/upload-artifact@v4
        with:
          name: plan.file
          path: terraform/${{ env.DIR }}/plan.file
          retention-days: 7

  check-prod:
    if: github.ref_name == 'prod'
    name: check-prod
    runs-on: ubuntu-latest
    environment: prod
    env:
          TF_VAR_folder: ${{ secrets.FOLDER }}
          DIR: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: ./terraform/${{ env.DIR }}
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        working-directory: ./terraform/${{ env.DIR }}
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ env.DIR }}/terraform.tfstate" \
            -backend-config="bucket=${{ secrets.BUCKET }}" \
            -backend-config="access_key=${{ secrets.ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SECRET_KEY }}"

      - name: Terraform Validate
        working-directory: ./terraform/${{ env.DIR }}
        run: terraform validate -no-color -json

      - name: Terraform Plan
        working-directory: ./terraform/${{ env.DIR }}
        run: |
          terraform plan -input=false -compact-warnings -out=plan.file
      
      - name: Save Plan
        uses: actions/upload-artifact@v4
        with:
          name: plan.file
          path: terraform/${{ env.DIR }}/plan.file
          retention-days: 7

  apply-dev:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    name: apply-dev
    needs: check-dev
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_VAR_folder: ${{ secrets.FOLDER }}
      DIR: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform/${{ env.DIR }}
        run: |
          terraform init -input=false \
            -backend-config="key=terraform/${{ env.DIR }}/terraform.tfstate" \
            -backend-config="bucket=${{ secrets.BUCKET }}" \
            -backend-config="access_key=${{ secrets.ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SECRET_KEY }}"
            
      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: plan.file
          path: ./terraform/${{ env.DIR }}

      - name: Terraform Apply
        working-directory: ./terraform/${{ env.DIR }}
        run: |
          terraform apply -input=false plan.file

  apply-prod:
      if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'prod'
      name: apply-prod
      needs: check-prod
      runs-on: ubuntu-latest
      environment: prod
      env:
        TF_VAR_folder: ${{ secrets.FOLDER }}
        DIR: prod
      steps:
        - uses: actions/checkout@v4
        - uses: hashicorp/setup-terraform@v3

        - name: Terraform Init
          working-directory: ./terraform/${{ env.DIR }}
          run: |
            terraform init -input=false \
              -backend-config="key=terraform/${{ env.DIR }}/terraform.tfstate" \
              -backend-config="bucket=${{ secrets.BUCKET }}" \
              -backend-config="access_key=${{ secrets.ACCESS_KEY }}" \
              -backend-config="secret_key=${{ secrets.SECRET_KEY }}"
              
        - name: Download Plan
          uses: actions/download-artifact@v4
          with:
            name: plan.file
            path: ./terraform/${{ env.DIR }}

        - name: Terraform Apply
          working-directory: ./terraform/${{ env.DIR }}
          run: |
            terraform apply -input=false plan.file