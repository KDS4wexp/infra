---
name: Main

on:
  push:
    branches:
      - feat/*
      - fix/*
  pull_request:
    types:
      - closed
    branches:
      - prod
      - dev

jobs:
  terraform-plan-dev:
    if: (github.head_ref || github.ref_name) != 'prod' 
    name: Terraform Plan
    uses: ./.github/workflows/terraform_plan.yml
    with:
      environment: dev
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
      CLOUD: ${{ secrets.CLOUD }}
      FOLDER: ${{ secrets.FOLDER }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}

  terraform-plan-prod:
    if: (github.head_ref || github.ref_name) == 'prod' 
    name: Terraform Plan
    uses: ./.github/workflows/terraform_plan.yml
    with:
      environment: prod
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
      CLOUD: ${{ secrets.CLOUD }}
      FOLDER: ${{ secrets.FOLDER }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}

  # terraform-apply:
  #   uses: ./.github/workflows/terraform_apply.yml

  # ansible:
  #   needs: terraform-apply
  #   uses: ./.github/workflows/ansible.yml