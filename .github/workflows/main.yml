---
name: Main

on:
  push:
    branches:
      - feat/*
      - fix/*
  pull_request:
    types:
      - closed
    branches:
      - prod
      - dev

jobs:
  setenv:
    name: Set Environment
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.setenv.outputs.env }}
    steps:
      - name: Set env
        id: setenv
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ "$BRANCH" == "prod" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

  terraform-plan:
    name: Terraform Plan for ${{ needs.setenv.outputs.env }}
    needs: setenv
    uses: ./.github/workflows/terraform_plan.yml
    with:
      environment: ${{ needs.setenv.outputs.env }}
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
      CLOUD: ${{ secrets.CLOUD }}
      FOLDER: ${{ secrets.FOLDER }}
      DOMAIN: ${{ secrets.DOMAIN }}
      PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}
      BUCKET: ${{ secrets.BUCKET }}
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

  # terraform-apply:
  #   uses: ./.github/workflows/terraform_apply.yml

  # ansible:
  #   needs: terraform-apply
  #   uses: ./.github/workflows/ansible.yml